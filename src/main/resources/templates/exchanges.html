<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head"></head>
<body>
<div th:replace="base :: body(pageTitle='Управление биржами', pageContent=~{::content})"></div>

<div th:fragment="content">
    <div class="mb-4">
        <button onclick="openModal('exchangeModal')" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
            <i class="fas fa-plus mr-2"></i>Добавить биржу
        </button>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full">
            <thead class="bg-gray-100">
            <tr>
                <th class="p-3 text-left">ID</th>
                <th class="p-3 text-left">Название</th>
                <th class="p-3 text-left">Страна</th>
                <th class="p-3 text-left">Веб-сайт</th>
                <th class="p-3 text-left">Год основания</th>
                <th class="p-3 text-left">Статус</th>
                <th class="p-3 text-left">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${exchanges}">
                <td class="p-3 border-b" th:text="${e.id}"></td>
                <td class="p-3 border-b" th:text="${e.name}"></td>
                <td class="p-3 border-b" th:text="${e.country}"></td>
                <td class="p-3 border-b"><a th:href="${e.website}" target="_blank" class="text-blue-600" th:text="${e.website}"></a></td>
                <td class="p-3 border-b" th:text="${e.founded}"></td>
                <td class="p-3 border-b">
                    <span th:if="${e.active}" class="bg-green-100 text-green-700 px-2 py-1 rounded text-sm">Активна</span>
                    <span th:unless="${e.active}" class="bg-red-100 text-red-700 px-2 py-1 rounded text-sm">Неактивна</span>
                </td>
                <td class="p-3 border-b">
                    <button onclick="deleteExchange(${e.id})" class="text-red-600"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
            <tr th:if="${exchanges == null or exchanges.empty}">
                <td colspan="7" class="p-8 text-center text-gray-400">Нет данных. Добавьте первую биржу</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="exchangeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg w-full max-w-md p-6">
            <h2 class="text-xl font-bold mb-4">Добавить биржу</h2>
            <form id="exchangeForm" onsubmit="saveExchange(event)">
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Название *</label>
                    <input type="text" id="exchangeName" required class="w-full border rounded-lg px-3 py-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Страна</label>
                    <input type="text" id="exchangeCountry" class="w-full border rounded-lg px-3 py-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Веб-сайт</label>
                    <input type="url" id="exchangeWebsite" class="w-full border rounded-lg px-3 py-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Описание</label>
                    <textarea id="exchangeDescription" rows="3" class="w-full border rounded-lg px-3 py-2"></textarea>
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Год основания</label>
                    <input type="number" id="exchangeFounded" class="w-full border rounded-lg px-3 py-2">
                </div>
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="exchangeActive" class="mr-2" checked> Активна
                    </label>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700">Сохранить</button>
                    <button type="button" onclick="closeModal('exchangeModal')" class="flex-1 bg-gray-300 py-2 rounded-lg hover:bg-gray-400">Отмена</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function saveExchange(event) {
        event.preventDefault();
        var data = {
            name: $('#exchangeName').val(),
            country: $('#exchangeCountry').val(),
            website: $('#exchangeWebsite').val(),
            description: $('#exchangeDescription').val(),
            founded: $('#exchangeFounded').val() ? parseInt($('#exchangeFounded').val()) : null,
            active: $('#exchangeActive').is(':checked')
        };

        $.ajax({
            url: '/api/exchanges',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function() {
                showToast('Биржа создана', 'success');
                closeModal('exchangeModal');
                location.reload();
            },
            error: function() { showToast('Ошибка сохранения', 'error'); }
        });
    }

    function deleteExchange(id) {
        if (confirm('Удалить биржу?')) {
            $.ajax({
                url: '/api/exchanges/' + id,
                method: 'DELETE',
                success: function() {
                    showToast('Биржа удалена', 'success');
                    location.reload();
                },
                error: function() { showToast('Ошибка удаления', 'error'); }
            });
        }
    }
</script>
</body>
</html>
