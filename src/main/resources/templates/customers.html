<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head"></head>
<body>
<div th:replace="base :: body(pageTitle='Управление клиентами', pageContent=~{::content})"></div>

<div th:fragment="content">
    <div class="mb-4">
        <button onclick="openModal('customerModal')" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
            <i class="fas fa-user-plus mr-2"></i>Добавить клиента
        </button>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full">
            <thead class="bg-gray-100">
            <tr>
                <th class="p-3 text-left">ID</th>
                <th class="p-3 text-left">Имя</th>
                <th class="p-3 text-left">Фамилия</th>
                <th class="p-3 text-left">Отчество</th>
                <th class="p-3 text-left">Email</th>
                <th class="p-3 text-left">Баланс</th>
                <th class="p-3 text-left">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${customers}">
                <td class="p-3 border-b" th:text="${c.id}"></td>
                <td class="p-3 border-b" th:text="${c.name}"></td>
                <td class="p-3 border-b" th:text="${c.familia}"></td>
                <td class="p-3 border-b" th:text="${c.otchestvo}"></td>
                <td class="p-3 border-b" th:text="${c.mail}"></td>
                <td class="p-3 border-b" th:text="'$ ' + ${c.balance}"></td>
                <td class="p-3 border-b">
                    <button onclick="deleteCustomer(${c.id})" class="text-red-600"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
            <tr th:if="${customers == null or customers.empty}">
                <td colspan="7" class="p-8 text-center text-gray-400">Нет данных. Добавьте первого клиента</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="customerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg w-full max-w-md p-6">
            <h2 class="text-xl font-bold mb-4">Добавить клиента</h2>
            <form id="customerForm" onsubmit="saveCustomer(event)">
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Имя *</label>
                    <input type="text" id="name" required class="w-full border rounded-lg px-3 py-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Фамилия *</label>
                    <input type="text" id="familia" required class="w-full border rounded-lg px-3 py-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Отчество</label>
                    <input type="text" id="otchestvo" class="w-full border rounded-lg px-3 py-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Email *</label>
                    <input type="email" id="mail" required class="w-full border rounded-lg px-3 py-2">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Баланс</label>
                    <input type="number" step="0.01" id="balance" class="w-full border rounded-lg px-3 py-2">
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700">Создать</button>
                    <button type="button" onclick="closeModal('customerModal')" class="flex-1 bg-gray-300 py-2 rounded-lg hover:bg-gray-400">Отмена</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function saveCustomer(event) {
        event.preventDefault();
        var data = {
            name: $('#name').val(),
            familia: $('#familia').val(),
            otchestvo: $('#otchestvo').val(),
            mail: $('#mail').val(),
            balance: parseFloat($('#balance').val()) || 0
        };

        $.ajax({
            url: '/api/customers',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function() {
                showToast('Клиент создан', 'success');
                closeModal('customerModal');
                location.reload();
            },
            error: function() { showToast('Ошибка создания', 'error'); }
        });
    }

    function deleteCustomer(id) {
        if (confirm('Удалить клиента?')) {
            $.ajax({
                url: '/api/customers/' + id,
                method: 'DELETE',
                success: function() {
                    showToast('Клиент удален', 'success');
                    location.reload();
                },
                error: function() { showToast('Ошибка удаления', 'error'); }
            });
        }
    }
</script>
</body>
</html>
