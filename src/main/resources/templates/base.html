<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Currency Exchange</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-hover {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        .nav-link {
            transition: all 0.2s;
        }
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<div class="flex min-h-screen">
    <!-- Sidebar -->
    <div class="w-64 glass m-4 mr-0 p-4 flex flex-col" style="background: rgba(15, 25, 45, 0.95);">
        <div class="text-center mb-8">
            <i class="fas fa-chart-line text-3xl text-purple-400"></i>
            <h1 class="text-white text-xl font-bold mt-2">CurrencyX</h1>
            <p class="text-gray-400 text-sm">Exchange Dashboard</p>
        </div>

        <nav class="flex-1">
            <a th:href="@{/}" class="nav-link flex items-center gap-3 text-gray-300 p-3 rounded-lg mb-2">
                <i class="fas fa-home w-5"></i> <span>Дашборд</span>
            </a>
            <a th:href="@{/currencies}" class="nav-link flex items-center gap-3 text-gray-300 p-3 rounded-lg mb-2">
                <i class="fas fa-coins w-5"></i> <span>Валюты</span>
            </a>
            <a th:href="@{/customers}" class="nav-link flex items-center gap-3 text-gray-300 p-3 rounded-lg mb-2">
                <i class="fas fa-users w-5"></i> <span>Клиенты</span>
            </a>
            <a th:href="@{/exchanges}" class="nav-link flex items-center gap-3 text-gray-300 p-3 rounded-lg mb-2">
                <i class="fas fa-building w-5"></i> <span>Биржи</span>
            </a>
            <a th:href="@{/sellers}" class="nav-link flex items-center gap-3 text-gray-300 p-3 rounded-lg mb-2">
                <i class="fas fa-store w-5"></i> <span>Продавцы</span>
            </a>
            <a th:href="@{/trades}" class="nav-link flex items-center gap-3 text-gray-300 p-3 rounded-lg mb-2">
                <i class="fas fa-exchange-alt w-5"></i> <span>Торги</span>
            </a>
        </nav>

        <div class="pt-4 border-t border-gray-700">
            <div class="flex items-center gap-3 text-gray-400">
                <i class="fas fa-user-circle text-2xl"></i>
                <div>
                    <p class="text-sm text-white">Admin</p>
                    <p class="text-xs">admin@currencyx.com</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-4">
        <div class="glass p-4 mb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800" th:text="${pageTitle}">Dashboard</h1>
            <div class="flex gap-2">
                <button onclick="refreshPage()" class="px-3 py-1 bg-purple-100 text-purple-600 rounded-lg hover:bg-purple-200">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <div class="glass p-6">
            <div th:replace="${pageContent}"></div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    function showToast(message, type) {
        var bgColor = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : 'bg-blue-500');
        var icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');
        var toast = $('<div class="toast ' + bgColor + ' text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2"><i class="fas ' + icon + '"></i><span>' + message + '</span></div>');
        $('#toast-container').append(toast);
        setTimeout(function() { toast.fadeOut(300, function() { toast.remove(); }); }, 3000);
    }

    function refreshPage() {
        location.reload();
    }

    function openModal(id) {
        $('#' + id).removeClass('hidden');
    }

    function closeModal(id) {
        $('#' + id).addClass('hidden');
        $('#' + id + ' form')[0]?.reset();
    }
</script>
</body>
</html>
