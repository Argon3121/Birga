<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head"></head>
<body>
<div th:replace="base :: body(pageTitle='Управление продавцами', pageContent=~{::content})"></div>

<div th:fragment="content">
    <div class="mb-4">
        <button onclick="openModal('sellerModal')" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
            <i class="fas fa-user-plus mr-2"></i>Добавить продавца
        </button>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full">
            <thead class="bg-gray-100">
            <tr>
                <th class="p-3 text-left">ID</th>
                <th class="p-3 text-left">Имя</th>
                <th class="p-3 text-left">Email</th>
                <th class="p-3 text-left">Телефон</th>
                <th class="p-3 text-left">Баланс</th>
                <th class="p-3 text-left">USD Sell</th>
                <th class="p-3 text-left">Статус</th>
                <th class="p-3 text-left">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${sellers}">
                <td class="p-3 border-b" th:text="${s.id}"></td>
                <td class="p-3 border-b" th:text="${s.name}"></td>
                <td class="p-3 border-b" th:text="${s.email}"></td>
                <td class="p-3 border-b" th:text="${s.phone}"></td>
                <td class="p-3 border-b" th:text="'$ ' + ${s.balance}"></td>
                <td class="p-3 border-b" th:text="${s.usdSellRate}"></td>
                <td class="p-3 border-b">
                    <span th:if="${s.active}" class="bg-green-100 text-green-700 px-2 py-1 rounded text-sm">Активен</span>
                    <span th:unless="${s.active}" class="bg-red-100 text-red-700 px-2 py-1 rounded text-sm">Неактивен</span>
                </td>
                <td class="p-3 border-b">
                    <button onclick="deleteSeller(${s.id})" class="text-red-600"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
            <tr th:if="${sellers == null or sellers.empty}">
                <td colspan="8" class="p-8 text-center text-gray-400">Нет данных. Добавьте первого продавца</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="sellerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 overflow-y-auto">
        <div class="bg-white rounded-lg w-full max-w-lg p-6 my-8">
            <h2 class="text-xl font-bold mb-4">Добавить продавца</h2>
            <form id="sellerForm" onsubmit="saveSeller(event)">
                <div class="grid grid-cols-2 gap-3">
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">Имя *</label>
                        <input type="text" id="sellerName" required class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">Email *</label>
                        <input type="email" id="sellerEmail" required class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">Телефон</label>
                        <input type="text" id="sellerPhone" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">Баланс</label>
                        <input type="number" step="0.01" id="sellerBalance" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">USD Buy Rate</label>
                        <input type="number" step="0.01" id="usdBuyRate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">USD Sell Rate</label>
                        <input type="number" step="0.01" id="usdSellRate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">EUR Buy Rate</label>
                        <input type="number" step="0.01" id="eurBuyRate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">EUR Sell Rate</label>
                        <input type="number" step="0.01" id="eurSellRate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">RUB Buy Rate</label>
                        <input type="number" step="0.0001" id="rubBuyRate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">RUB Sell Rate</label>
                        <input type="number" step="0.0001" id="rubSellRate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">KZT Buy Rate</label>
                        <input type="number" step="0.0001" id="kztBuyRate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">KZT Sell Rate</label>
                        <input type="number" step="0.0001" id="kztSellRate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="sellerActive" class="mr-2" checked> Активен
                    </label>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700">Сохранить</button>
                    <button type="button" onclick="closeModal('sellerModal')" class="flex-1 bg-gray-300 py-2 rounded-lg hover:bg-gray-400">Отмена</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function saveSeller(event) {
        event.preventDefault();
        var data = {
            name: $('#sellerName').val(),
            email: $('#sellerEmail').val(),
            phone: $('#sellerPhone').val(),
            balance: parseFloat($('#sellerBalance').val()) || 0,
            usdBuyRate: parseFloat($('#usdBuyRate').val()) || 0,
            usdSellRate: parseFloat($('#usdSellRate').val()) || 0,
            eurBuyRate: parseFloat($('#eurBuyRate').val()) || 0,
            eurSellRate: parseFloat($('#eurSellRate').val()) || 0,
            rubBuyRate: parseFloat($('#rubBuyRate').val()) || 0,
            rubSellRate: parseFloat($('#rubSellRate').val()) || 0,
            kztBuyRate: parseFloat($('#kztBuyRate').val()) || 0,
            kztSellRate: parseFloat($('#kztSellRate').val()) || 0,
            active: $('#sellerActive').is(':checked')
        };

        $.ajax({
            url: '/api/sellers',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function() {
                showToast('Продавец создан', 'success');
                closeModal('sellerModal');
                location.reload();
            },
            error: function() { showToast('Ошибка сохранения', 'error'); }
        });
    }

    function deleteSeller(id) {
        if (confirm('Удалить продавца?')) {
            $.ajax({
                url: '/api/sellers/' + id,
                method: 'DELETE',
                success: function() {
                    showToast('Продавец удален', 'success');
                    location.reload();
                },
                error: function() { showToast('Ошибка удаления', 'error'); }
            });
        }
    }
</script>
</body>
</html>
