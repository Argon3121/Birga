<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head"></head>
<body>
<div th:replace="base :: body(pageTitle='Дашборд', pageContent=~{::content})"></div>

<div th:fragment="content">
    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl p-4">
            <i class="fas fa-coins text-2xl mb-2"></i>
            <p class="text-2xl font-bold" th:text="${currencyCount}">0</p>
            <p class="text-sm opacity-90">Всего валют</p>
        </div>
        <div class="bg-gradient-to-r from-blue-500 to-cyan-500 text-white rounded-xl p-4">
            <i class="fas fa-users text-2xl mb-2"></i>
            <p class="text-2xl font-bold" th:text="${customerCount}">0</p>
            <p class="text-sm opacity-90">Клиентов</p>
        </div>
        <div class="bg-gradient-to-r from-green-500 to-emerald-500 text-white rounded-xl p-4">
            <i class="fas fa-building text-2xl mb-2"></i>
            <p class="text-2xl font-bold" th:text="${exchangeCount}">0</p>
            <p class="text-sm opacity-90">Бирж</p>
        </div>
        <div class="bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl p-4">
            <i class="fas fa-store text-2xl mb-2"></i>
            <p class="text-2xl font-bold" th:text="${sellerCount}">0</p>
            <p class="text-sm opacity-90">Продавцов</p>
        </div>
    </div>

    <!-- Welcome -->
    <div class="text-center py-8">
        <i class="fas fa-chart-line text-6xl text-purple-400 mb-4"></i>
        <h2 class="text-2xl font-bold text-gray-800">Добро пожаловать в CurrencyX</h2>
        <p class="text-gray-500 mt-2">Управляйте валютами, клиентами и обменными операциями</p>
    </div>

    <!-- Recent Data -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
        <div>
            <h3 class="font-bold text-gray-700 mb-3">Последние валюты</h3>
            <div class="space-y-2">
                <div th:each="c : ${recentCurrencies}" class="flex justify-between items-center p-2 bg-gray-50 rounded">
                    <span><strong th:text="${c.code}"></strong> - <span th:text="${c.name}"></span></span>
                    <span class="text-purple-600 font-bold" th:text="${c.rateToCNY} + ' CNY'"></span>
                </div>
                <div th:if="${recentCurrencies == null or recentCurrencies.empty}" class="text-gray-400 text-center py-4">
                    Нет данных
                </div>
            </div>
        </div>
        <div>
            <h3 class="font-bold text-gray-700 mb-3">Последние клиенты</h3>
            <div class="space-y-2">
                <div th:each="c : ${recentCustomers}" class="flex justify-between items-center p-2 bg-gray-50 rounded">
                    <span><span th:text="${c.name}"></span> <span th:text="${c.familia}"></span></span>
                    <span class="text-sm text-gray-500" th:text="${c.mail}"></span>
                </div>
                <div th:if="${recentCustomers == null or recentCustomers.empty}" class="text-gray-400 text-center py-4">
                    Нет данных
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
