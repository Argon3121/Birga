<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="sidebar" class="w-72 glass-dark shadow-2xl flex flex-col">
    <div class="p-6 border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-xl flex items-center justify-center">
                <i class="fas fa-chart-line text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-white font-bold text-xl">CurrencyX</h1>
                <p class="text-white/50 text-xs">Premium Exchange</p>
            </div>
        </div>
    </div>
    <nav class="flex-1 p-4 space-y-2">
        <a th:href="@{/}" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 hover:bg-white/10 group">
            <i class="fas fa-tachometer-alt w-5 text-white/60 group-hover:text-white"></i>
            <span class="text-white/80 group-hover:text-white">Дашборд</span>
        </a>
        <a th:href="@{/currencies}" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 hover:bg-white/10 group">
            <i class="fas fa-coins w-5 text-white/60 group-hover:text-white"></i>
            <span class="text-white/80 group-hover:text-white">Валюты</span>
        </a>
        <a th:href="@{/customers}" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 hover:bg-white/10 group">
            <i class="fas fa-users w-5 text-white/60 group-hover:text-white"></i>
            <span class="text-white/80 group-hover:text-white">Клиенты</span>
        </a>
        <a th:href="@{/exchanges}" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 hover:bg-white/10 group">
            <i class="fas fa-building w-5 text-white/60 group-hover:text-white"></i>
            <span class="text-white/80 group-hover:text-white">Биржи</span>
        </a>
        <a th:href="@{/sellers}" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 hover:bg-white/10 group">
            <i class="fas fa-store w-5 text-white/60 group-hover:text-white"></i>
            <span class="text-white/80 group-hover:text-white">Продавцы</span>
        </a>
        <a th:href="@{/trades}" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 hover:bg-white/10 group">
            <i class="fas fa-chart-simple w-5 text-white/60 group-hover:text-white"></i>
            <span class="text-white/80 group-hover:text-white">Торги</span>
        </a>
    </nav>
    <div class="p-4 border-t border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-full flex items-center justify-center">
                <i class="fas fa-user text-white"></i>
            </div>
            <div class="flex-1">
                <p class="text-white text-sm font-medium">Admin User</p>
                <p class="text-white/40 text-xs">admin@currencyx.com</p>
            </div>
            <button onclick="document.body.classList.toggle('dark')" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20">
                <i class="fas fa-moon text-white/70"></i>
            </button>
        </div>
    </div>
</div>
<script>
    $(document).ready(function() {
        const currentPath = window.location.pathname;
        $('.nav-item').each(function() {
            if ($(this).attr('href') === currentPath) {
                $(this).addClass('bg-white/20');
                $(this).find('i, span').addClass('text-white');
            }
        });
    });
</script>
</html>
