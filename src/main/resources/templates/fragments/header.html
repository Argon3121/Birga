<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="header" class="glass shadow-lg sticky top-0 z-10">
    <div class="px-6 py-4 flex items-center justify-between">
        <div class="flex-1 max-w-md">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="globalSearch" placeholder="Поиск по всем данным..."
                       class="w-full pl-10 pr-4 py-2 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button class="relative w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20">
                <i class="fas fa-bell text-white/70"></i>
                <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-white text-xs flex items-center justify-center">3</span>
            </button>
            <button onclick="location.reload()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20">
                <i class="fas fa-arrows-rotate text-white/70"></i>
            </button>
        </div>
    </div>
</div>
</html>
